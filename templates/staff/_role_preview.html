<aside class="card jcf-role-preview" aria-label="Role permissions"><div class="card-body"><h2 class="h5">What this role can do</h2><div aria-live="polite">{% for role in roles %}<section data-role-preview="{{ role.value }}"><h3 class="h6">{{ role.label }}</h3><p>{{ role.description }}</p><ul>{% for area in role.areas %}<li>{{ area }}</li>{% endfor %}</ul></section>{% endfor %}</div><a href="{% url 'staff:role_guide' %}" target="_blank" rel="noopener">Compare all roles <span class="visually-hidden">(opens in a new tab)</span><i class="ph ph-arrow-up-right" aria-hidden="true"></i></a></div></aside>
