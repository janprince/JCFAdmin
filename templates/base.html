{% load static %}
<!doctype html>
<html lang="en" data-skin="saas" data-menu-color="dark" data-topbar-color="light">
<head>
    <meta charset="utf-8" />
    <title>{% block title %}JCF Management{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'paces/images/favicon.ico' %}" />

    <link rel="preload" href="{% static 'jcf/fonts/PublicSans-Variable.ttf' %}" as="font" type="font/ttf" crossorigin />

    {% block extra_css %}{% endblock %}

    <!-- Theme Config Js -->
    <script src="{% static 'paces/js/config.js' %}"></script>

    <!-- config.js restores a cached config from sessionStorage, which would keep
         old sessions on whatever skin and sidebar colour they were served
         before. Pin both. -->
    <script>
        (() => {
            const pinned = { skin: 'saas', 'sidenav-color': 'dark', 'topbar-color': 'light' };
            const html = document.documentElement;
            html.setAttribute('data-skin', pinned.skin);
            html.setAttribute('data-menu-color', pinned['sidenav-color']);
            html.setAttribute('data-topbar-color', pinned['topbar-color']);
            if (window.config) { Object.assign(window.config, pinned); }
            try {
                const cached = JSON.parse(sessionStorage.getItem('__THEME_CONFIG__') || 'null');
                if (cached && Object.keys(pinned).some((k) => cached[k] !== pinned[k])) {
                    sessionStorage.setItem('__THEME_CONFIG__', JSON.stringify(Object.assign(cached, pinned)));
                }
            } catch (e) { /* private mode / malformed cache — the attributes above are enough */ }
        })();
    </script>

    <!-- Vendor css -->
    <link href="{% static 'paces/css/vendors.min.css' %}" rel="stylesheet" type="text/css" />

    <!-- App css -->
    <link id="app-style" href="{% static 'paces/css/app.min.css' %}" rel="stylesheet" type="text/css" />

    <!-- JCF brand (text logo) -->
    <link href="{% static 'jcf/css/brand.css' %}" rel="stylesheet" type="text/css" />

    <!-- Icons: Phosphor (regular for UI, light for large empty-state art).
         Tabler still ships inside vendors.min.css for Paces' own widgets. -->
    <link href="{% static 'vendor/phosphor/regular/style.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'vendor/phosphor/light/style.css' %}" rel="stylesheet" type="text/css" />

    <!-- JCF shell (sidebar, topbar, page header) and UI components -->
    <link href="{% static 'jcf/css/shell.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'jcf/css/ui.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'jcf/css/office.css' %}" rel="stylesheet" />
</head>

<body>
    {% block body %}{% endblock %}

    <!-- Vendor js -->
    <script src="{% static 'paces/js/vendors.min.js' %}"></script>

    <!-- App js -->
    <script src="{% static 'paces/js/app.js' %}"></script>

    <!-- JCF behaviours (modal re-open on errors, data-confirm) -->
    <script src="{% static 'jcf/js/ui.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
