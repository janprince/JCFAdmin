<dialog class="jcf-finder" id="page-finder" aria-labelledby="page-finder-title">
    <div class="jcf-finder__head"><h2 id="page-finder-title">Find a page</h2><button type="button" class="jcf-topbar-btn" data-finder-close aria-label="Close page finder"><i class="ph ph-x" aria-hidden="true"></i></button></div>
    <label class="jcf-finder__search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><span class="visually-hidden">Search pages</span><input type="search" id="page-finder-query" placeholder="Try donations, members or events" autocomplete="off" aria-controls="page-finder-results"></label>
    <nav id="page-finder-results" class="jcf-finder__results" aria-label="Matching pages"></nav>
    <p class="jcf-finder__empty" hidden>No pages match. Try a different page name.</p>
    <p class="jcf-finder__hint">Search pages in the portal. Use each page’s search to find records.</p>
    <p class="visually-hidden" id="page-finder-status" role="status"></p>
</dialog>
