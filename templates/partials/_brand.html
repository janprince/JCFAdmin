{% comment %}
Full JCF wordmark. `size` is optional: "auth" renders the larger login lockup.
{% endcomment %}
<span class="jcf-logo{% if size == 'auth' %} jcf-logo--auth{% endif %}">
    <span class="jcf-logo__mark">JCF</span>
    <span class="jcf-logo__rule"></span>
    <span class="jcf-logo__word">Management</span>
</span>
